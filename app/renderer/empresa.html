<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Empresa</title>
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="d-flex justify-content-between mb-4">
            <button class="btn btn-outline-primary" onclick="window.electronAPI.goHome()">Home</button>
            <button class="btn btn-outline-secondary" onclick="window.electronAPI.openPage('listaempresa.html')">Lista de empresas</button>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-body p-4">

                        <h3 class="text-center mb-4">Cadastro de Empresa</h3>

                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Nome da empresa" id="name">
                        </div>

                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="CNPJ" id="cnpj">
                        </div>

                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Telefone" id="phone">
                        </div>

                        <div class="mb-4">
                            <input type="text" class="form-control" placeholder="Endereço" id="address">
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-success" id="save-button">Salvar Empresa</button>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="empresa.js"></script>
</body>

</html>
